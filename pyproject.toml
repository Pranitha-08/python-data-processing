[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "de-utils"
version = "0.1.0"
description = "Pranitha's Data Engineering Utility Library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0",
    "faker>=20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]
